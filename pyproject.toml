[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mockr"
version = "0.1.0"
description = "Terminal-native AI mock interview tool with code execution, diagramming, and spaced repetition"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Andrew Kim" }]
keywords = ["interview", "mock-interview", "terminal", "tui", "coding-practice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "duckdb>=1.0.0",
    "click>=8.1.0",
    "tomli>=2.0.0; python_version < '3.12'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
all = ["openai>=1.0.0", "anthropic>=0.30.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/junseokakim/mockr"
Issues = "https://github.com/junseokakim/mockr/issues"
Changelog = "https://github.com/junseokakim/mockr/blob/main/CHANGELOG.md"

[project.scripts]
mockr = "mockr.cli:main"
